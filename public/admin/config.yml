# ---------------------------------------------------------------------------
# Decap CMS — New Apostolic English High School
#
# Git-backed, free, and hosted entirely on Vercel:
#   • Editors sign in with GitHub (see /api/oauth/auth and /api/oauth/callback)
#   • Saving writes a commit to this repository
#   • The commit triggers a Vercel deployment, and the site updates
#
# `backend.base_url` is set at runtime in index.html so the same configuration
# works on the production domain and on preview deployments.
# ---------------------------------------------------------------------------

# Editing on http://localhost uses the local proxy (`npm run cms`) instead of
# GitHub, so a second OAuth app is not needed for development.
local_backend: true

backend:
  name: github
  repo: riteshbhagat24/naes
  branch: main
  auth_endpoint: api/oauth/auth
  commit_messages:
    create: 'content: create {{collection}} “{{slug}}”'
    update: 'content: update {{collection}} “{{slug}}”'
    delete: 'content: delete {{collection}} “{{slug}}”'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'

publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

# site_url and display_url are set at runtime in index.html from
# window.location.origin, so the CMS follows the Vercel address today and the
# school's own domain later, with nothing to edit here.
logo_url: /brand/logo-crest-512.png

collections:
  # =========================================================== site settings
  - name: site
    label: Site
    label_singular: Setting
    description: Announcement bar and site-wide notices.
    files:
      - name: announcement
        label: Announcement bar
        file: content/site/announcement.json
        fields:
          - { name: enabled, label: Show the announcement bar, widget: boolean, default: true }
          - { name: label, label: Short label, widget: string, hint: 'e.g. Admissions' }
          - { name: message, label: Message, widget: string }
          - { name: linkText, label: Link text, widget: string }
          - { name: linkHref, label: Link URL, widget: string, default: /admissions/enquiry }
          - {
              name: tone,
              label: Tone,
              widget: select,
              options: [primary, accent, neutral],
              default: primary,
            }

