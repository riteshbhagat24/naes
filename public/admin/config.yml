              - { name: suffix, label: Suffix, widget: string, required: false }
              - { name: prefix, label: Prefix, widget: string, required: false }
              - { name: label, label: Label, widget: string }
              - { name: detail, label: Detail, widget: text }

      - name: about
        label: 3 · About the school
        file: content/home/about.json
        fields:
          - { name: eyebrow, label: Eyebrow, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: lead, label: Lead sentence, widget: text }
          - {
              name: paragraphs,
              label: Paragraphs,
              widget: list,
              field: { name: text, label: Paragraph, widget: text },
            }
          - name: highlights
            label: Principles
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
          - name: images
            label: Image cluster (exactly three)
            widget: list
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: Alt text, widget: string }
          - name: cta
            label: Link
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }

      - name: why
