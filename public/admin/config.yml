              name: headlineLines,
              label: Headline (one line per entry),
              widget: list,
              field: { name: line, label: Line, widget: string },
            }
          - { name: subheadline, label: Sub-headline, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - name: primaryCta
            label: Primary button
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - name: secondaryCta
